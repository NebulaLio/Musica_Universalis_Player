<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RHINE LAB · AUDIO ARCHIVE</title>
  <style>
:root {
  --paper: #e7e5e1;
  --ink: #111214;
  --plate: #101112;
  --plate-2: #0b0c0e;
  --plate-3: #16181a;
  --orange: #ff7b00;
  --lime: #b9e432;
  --text: #e7e5e1;
  --muted: #8b9098;
  --line: rgba(231, 229, 225, 0.14);
  --line-2: rgba(231, 229, 225, 0.26);
  --mono: ui-monospace, "Cascadia Mono", "JetBrains Mono", Consolas, "Courier New", monospace;
  --sans: "MiSans", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }

html, body { margin: 0; height: 100%; }

body {
  font-family: var(--sans);
  background:
    radial-gradient(1200px 600px at 78% -12%, rgba(255, 123, 0, 0.09), transparent 55%),
    var(--plate);
  color: var(--text);
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}

/* 半调网点 grain */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  opacity: 0.05;
  background-image: radial-gradient(currentColor 0.5px, transparent 0.6px);
  background-size: 3px 3px;
}

button, select { font-family: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 1px solid var(--orange); outline-offset: 2px; }

/* ============ 载入动画 ============ */
#loader {
  position: fixed;
  inset: 0;
  z-index: 200;
  background: var(--plate);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  transition: opacity 0.55s ease, visibility 0.55s ease;
}
#loader.done { opacity: 0; visibility: hidden; pointer-events: none; }
.loader-ring svg { width: 96px; height: 96px; display: block; animation: spin 9s linear infinite; }
.lr-arc { animation: draw-ring 1.1s cubic-bezier(0.4, 0, 0.2, 1) 0.1s forwards; }
@keyframes draw-ring { to { stroke-dashoffset: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }
.loader-brand {
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.3em;
  color: var(--paper);
  white-space: nowrap;
  overflow: hidden;
  border-right: 2px solid var(--orange);
  width: 0;
  animation: type 0.95s steps(9, end) 0.25s forwards;
}
@keyframes type { from { width: 0; } to { width: 11ch; } }
.loader-line { width: 190px; height: 2px; background: rgba(231, 229, 225, 0.16); overflow: hidden; }
.loader-line i { display: block; height: 100%; width: 0; background: var(--orange); animation: loadline 1.15s cubic-bezier(0.3, 0.6, 0.3, 1) 0.2s forwards; }
@keyframes loadline { to { width: 100%; } }
.loader-sub {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  animation: blink 1.2s step-end infinite;
}
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0.25; } }

/* 扫描线 */
.scan {
  position: fixed;
  left: 0;
  right: 0;
  top: 0;
  height: 40%;
  pointer-events: none;
  z-index: 1;
  background: linear-gradient(180deg, transparent, rgba(255, 123, 0, 0.05), transparent);
  animation: scan 7s linear infinite;
}
@keyframes scan { from { transform: translateY(-110%); } to { transform: translateY(340%); } }

/* ============ topbar ============ */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 0 20px;
  background: var(--plate-2);
  border-bottom: 1px solid var(--line);
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.logo {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border: 2px solid var(--orange);
  border-radius: 50%;
}
.logo i { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--orange); }
.brand-name {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.22em;
  color: var(--text);
  font-weight: 600;
}
.topbar-actions { display: flex; align-items: center; gap: 12px; }
.search {
  width: 210px;
  height: 30px;
  padding: 0 12px;
  border: 1px solid var(--line-2);
  background: var(--plate);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.04em;
  -webkit-user-select: text;
  user-select: text;
}
.search:focus { border-color: var(--orange); outline: none; }
.search::placeholder { color: var(--muted); }
.lang-sel {
  height: 30px;
  padding: 0 8px;
  border: 1px solid var(--line-2);
  background: var(--plate);
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.04em;
}
.lang-sel:focus { border-color: var(--orange); }
.btn-primary {
  height: 30px;
  padding: 0 14px;
  border: 0;
  background: var(--orange);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  transition: filter 0.15s ease, transform 0.15s ease;
}
.btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }

/* ============ layout ============ */
.layout {
  position: fixed;
  top: 56px;
  left: 0;
  right: 0;
  bottom: 110px;
  display: flex;
}
.side {
  width: 200px;
  flex: none;
  padding: 18px 12px;
  background: var(--plate-2);
  border-right: 1px solid var(--line);
  overflow-y: auto;
}
.side-title {
  padding: 4px 10px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
}
.side-title.second { margin-top: 22px; }
.side-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  margin-top: 4px;
  padding: 9px 10px;
  border: 0;
  background: transparent;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.06em;
  text-align: left;
  position: relative;
  transition: background 0.15s ease, color 0.15s ease, transform 0.15s ease;
}
.side-item:hover { background: rgba(255, 255, 255, 0.04); transform: translateX(2px); }
.side-item.active { background: rgba(255, 123, 0, 0.09); color: var(--orange); }
.side-item.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--orange); }
.side-item .cnt { font-size: 10px; color: var(--muted); }
.side-note { padding: 4px 10px; font-family: var(--mono); font-size: 10px; line-height: 1.8; color: var(--muted); }

.main {
  position: relative;
  flex: 1;
  min-width: 0;
  padding: 18px 24px;
  overflow-y: auto;
  border-left: 2px solid var(--orange);
}
.main-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.main-head h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: 0.02em; }
.sub { font-family: var(--mono); color: var(--muted); font-size: 11px; letter-spacing: 0.1em; }

/* ============ 视频模块 ============ */
.video-panel {
  display: none;
  position: relative;
  background: #000;
  border: 1px solid var(--line);
  margin-bottom: 16px;
}
.video-panel.visible { display: block; animation: vpIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
@keyframes vpIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.video-panel video { display: block; width: 100%; max-height: 56vh; background: #000; }
.video-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  background: linear-gradient(180deg, rgba(8, 9, 10, 0.78), transparent);
}
.video-title { font-size: 13px; color: var(--paper); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.video-actions { display: flex; gap: 8px; flex: none; }
.vbtn {
  border: 1px solid rgba(231, 229, 225, 0.28);
  background: rgba(8, 9, 10, 0.55);
  color: var(--paper);
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  padding: 4px 9px;
  transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
}
.vbtn:hover { border-color: var(--orange); color: var(--orange); }
.vbtn.big { font-size: 15px; color: var(--orange); padding: 3px 10px; }
.video-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-top: 1px solid var(--line);
  background: var(--plate-2);
}
.video-controls .progress { flex: 1; }

/* 网页全屏 */
.video-panel.web-full {
  position: fixed;
  inset: 0;
  z-index: 45;
  margin: 0;
  display: flex;
  flex-direction: column;
  background: #000;
  animation: none;
}
.video-panel.web-full video { flex: 1; max-height: none; object-fit: contain; min-height: 0; }
.video-panel.web-full .video-controls {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(8, 9, 10, 0.62);
  border-top: 0;
}
.video-panel.web-full .video-top { position: absolute; }

/* ============ song list ============ */
.list-head {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) 80px;
  gap: 12px;
  padding: 8px 16px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px solid var(--line);
}
.song-list { display: flex; flex-direction: column; }
.song {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) 80px;
  gap: 12px;
  align-items: center;
  padding: 9px 16px;
  cursor: pointer;
  position: relative;
  transition: background 0.15s ease, transform 0.15s ease;
}
.song:hover { background: rgba(255, 255, 255, 0.04); transform: translateX(3px); }
.song.current { background: rgba(255, 123, 0, 0.08); }
.song.current::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--orange); }
.song-num { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: center; display: flex; align-items: center; justify-content: center; }
.song.current .song-num { color: var(--orange); }
.song-playing-ico { color: var(--orange); }
.song-main { min-width: 0; }
.song-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song.current .song-title { color: var(--orange); }
.song-meta { margin-top: 2px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.song-meta .tag-video { color: var(--lime); border: 1px solid rgba(185, 228, 50, 0.5); padding: 0 4px; margin-right: 6px; }
.song-dur { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.song.current .song-dur { color: var(--orange); }
.song-remove { visibility: hidden; border: 0; background: transparent; color: var(--muted); font-size: 14px; padding: 0 4px; }
.song:hover .song-remove { visibility: visible; }
.song-remove:hover { color: var(--orange); }

/* 科技感均衡器（当前行） */
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
.eq i { width: 3px; height: 100%; background: var(--orange); transform-origin: bottom; animation: eq 1s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: 0.18s; }
.eq i:nth-child(3) { animation-delay: 0.36s; }
@keyframes eq { 0%, 100% { transform: scaleY(0.3); } 50% { transform: scaleY(1); } }

.empty { padding: 70px 20px; text-align: center; color: var(--muted); font-family: var(--mono); }
.empty-ico { font-size: 42px; color: var(--orange); margin-bottom: 14px; }
.empty-sub { margin-top: 8px; font-size: 11px; letter-spacing: 0.06em; }

/* ============ playbar ============ */
.playbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 66px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  background: var(--plate-2);
  border-top: 1px solid var(--line);
  z-index: 20;
}
.playbar::before {
  content: "";
  position: absolute;
  top: -2px;
  left: 0;
  width: 120px;
  height: 2px;
  background: var(--orange);
}
.pb-left { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
.cover {
  position: relative;
  width: 46px;
  height: 46px;
  flex: none;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--text);
  overflow: hidden;
}
.cover::before { content: ""; position: absolute; inset: 0; border: 2px solid var(--orange); border-radius: 50%; }
.cover .disc {
  position: absolute;
  inset: 3px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #1c1e20 0 40%, #08090a 40% 100%);
}
.cover.spinning { animation: spin 14s linear infinite; }
.playbar.playing .cover::before { animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(255, 123, 0, 0.45); }
  50% { box-shadow: 0 0 0 7px rgba(255, 123, 0, 0); }
}
.cover-letter { position: relative; z-index: 1; font-family: var(--mono); font-size: 17px; }
.pb-info { min-width: 0; }
.pb-title { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-artist { margin-top: 2px; font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.pb-center { flex: 2; min-width: 0; display: flex; flex-direction: column; gap: 7px; }
.pb-controls { display: flex; align-items: center; justify-content: center; gap: 18px; }
.ctrl { border: 0; background: transparent; color: var(--text); font-size: 16px; padding: 4px 6px; line-height: 1; transition: color 0.15s ease, border-color 0.15s ease, transform 0.15s ease; }
.ctrl:hover { color: var(--orange); }
.ctrl:active { transform: scale(0.92); }
.ctrl.mode {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--muted);
  padding: 3px 9px;
  border: 1px solid var(--line-2);
}
.ctrl.mode:hover { color: var(--orange); border-color: var(--orange); }
.ctrl.big { font-size: 24px; color: var(--orange); transition: transform 0.15s ease, color 0.15s ease; }
.ctrl.big:hover { color: var(--paper); transform: scale(1.08); }

.pb-progress { display: flex; align-items: center; gap: 10px; }
.time { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 38px; text-align: center; }
.progress { position: relative; flex: 1; height: 18px; display: flex; align-items: center; cursor: pointer; }
.progress::before { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: rgba(231, 229, 225, 0.16); }
.progress .fill { position: absolute; left: 0; height: 3px; background: var(--orange); width: 0%; }
.progress .thumb {
  position: absolute;
  left: 0%;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: var(--orange);
  transform: translateX(-50%);
  opacity: 0;
  transition: opacity 0.15s;
}
.progress:hover .thumb { opacity: 1; }
.playbar.playing .progress .thumb { opacity: 1; box-shadow: 0 0 8px var(--orange); }

.pb-right { flex: 1; display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
.queue-badge { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.vol { display: flex; align-items: center; gap: 8px; }
.vol-ico { font-size: 14px; color: var(--muted); }
.vol input { -webkit-appearance: none; appearance: none; width: 80px; height: 18px; background: transparent; cursor: pointer; }
.vol input::-webkit-slider-runnable-track { height: 3px; background: rgba(231, 229, 225, 0.16); }
.vol input::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; margin-top: -4px; background: var(--orange); border: 0; }

/* 裁切角 */
.corner { position: absolute; width: 8px; height: 8px; border: 1px solid var(--orange); opacity: 0.85; pointer-events: none; }
.corner.tl { top: 6px; left: 6px; border-right: 0; border-bottom: 0; }
.corner.tr { top: 6px; right: 6px; border-left: 0; border-bottom: 0; }
.corner.bl { bottom: 6px; left: 6px; border-right: 0; border-top: 0; }
.corner.br { bottom: 6px; right: 6px; border-left: 0; border-top: 0; }

/* ============ drawer (queue) ============ */
.drawer {
  position: fixed;
  top: 56px;
  right: -330px;
  bottom: 110px;
  width: 330px;
  background: var(--plate-2);
  border-left: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  transition: right 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
  z-index: 25;
}
.drawer.open { right: 0; }
.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
}
.drawer-actions { display: flex; align-items: center; gap: 14px; }
.link-btn { border: 0; background: transparent; color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; padding: 0; transition: color 0.15s ease; }
.link-btn:hover { color: var(--orange); }
.queue-list { flex: 1; overflow-y: auto; }
.q-item { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; position: relative; transition: background 0.15s ease; }
.q-item:hover { background: rgba(255, 255, 255, 0.04); }
.q-item.current { background: rgba(255, 123, 0, 0.08); }
.q-item.current::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--orange); }
.q-name { flex: 1; min-width: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-item.current .q-name { color: var(--orange); }
.q-dur { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.q-del { visibility: hidden; border: 0; background: transparent; color: var(--muted); font-size: 13px; }
.q-item:hover .q-del { visibility: visible; }
.q-del:hover { color: var(--orange); }
.drawer-now { padding: 20px 16px; border-top: 1px solid var(--line); text-align: center; }
.disc-big {
  width: 120px;
  height: 120px;
  margin: 0 auto 12px;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 50%, #1c1e20 0 34%, #08090a 34% 100%);
  border: 2px solid var(--orange);
  display: grid;
  place-items: center;
  color: var(--orange);
  font-family: var(--mono);
  font-size: 26px;
  animation: spin 16s linear infinite;
}
.disc-big.paused { animation-play-state: paused; }
.drawer-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.drawer-artist { margin-top: 3px; font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; color: var(--muted); }
.visualizer { display: block; width: 100%; height: 100%; }

/* 科技感音乐动态条（播放条上方） */
.viz-strip {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 66px;
  height: 44px;
  background: rgba(11, 12, 14, 0.88);
  border-top: 1px solid var(--line);
  border-bottom: 1px solid rgba(255, 123, 0, 0.25);
  z-index: 19;
  overflow: hidden;
}
.drawer-lyrics { margin-top: 14px; font-family: var(--mono); font-size: 11px; color: var(--muted); line-height: 1.9; min-height: 40px; }

@media (max-width: 720px) {
  .side { display: none; }
  .pb-center { flex: 1.6; }
  .pb-right .vol { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  .scan, .cover.spinning, .disc-big, .eq i, .loader-sub, .loader-brand, .lr-arc { animation: none; }
  .loader-brand { width: 11ch; border-right: 0; }
  .loader-line i { width: 100%; }
}
  </style>
</head>
<body>
  <!-- 载入动画 -->
  <div id="loader" aria-hidden="true">
    <div class="loader-ring">
      <svg viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,123,0,0.18)" stroke-width="1"></circle>
        <circle class="lr-arc" cx="32" cy="32" r="26" fill="none" stroke="#ff7b00" stroke-width="1.6" stroke-dasharray="163" stroke-dashoffset="163"></circle>
        <circle cx="32" cy="32" r="3.5" fill="#ff7b00"></circle>
      </svg>
    </div>
    <div class="loader-brand">RHINE LAB</div>
    <div class="loader-line"><i id="loaderFill"></i></div>
    <div class="loader-sub" id="loaderSub">INITIALIZING ARCHIVE…</div>
  </div>

  <div class="scan" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><i></i></span>
      <span class="brand-name">RHINE LAB · AUDIO ARCHIVE</span>
    </div>

  <div id="drawer" class="drawer">

  <input id="fileInput" type="file" multiple accept="audio/*,video/*,.mp3,.flac,.wav,.ogg,.oga,.opus,.m4a,.aac,.aif,.aiff,.webm,.mp4,.ogv,.mov,.m4v" style="display:none">
  <script>
/* RHINE LAB · AUDIO ARCHIVE — 本地播放器（音頻＋視頻、動態條、載入動畫、三語切換） */
(function () {
  'use strict';

  const $ = (sel) => document.querySelector(sel);

  /* ---------------- i18n ---------------- */
  const I18N = {
    'zh-CN': {
      'import': '导入', 'search': '搜索本地歌曲',
      'nav.all': '全部歌曲', 'nav.audio': '本地音乐', 'nav.video': '视频',
      'about': '档案终端 · 本地播放',
      'title': '标题', 'duration': '时长',
      'empty.title': '暂无歌曲', 'empty.video': '暂无视频',
      'empty.sub': '点击右上角「导入」，或直接把音频/视频文件拖进页面',
      'count': '共 {n} 首',
      'pb.none': '未播放', 'pb.local': '本地',
      'mode.list': '顺序', 'mode.loop': '循环', 'mode.one': '单曲', 'mode.shuffle': '随机',
      'mode.title': '播放模式',
      'prev': '上一首', 'next': '下一首', 'playpause': '播放 / 暂停',
      'volume': '音量', 'seek': '进度', 'queue': '播放队列', 'clear': '清空', 'close': '关闭',
      'lyrics.none': '暂无歌词（本地文件不包含歌词）',
      'webFull': '网页全屏', 'full': '全屏',
      'loader.sub': '正在初始化档案',
    },
    'zh-TW': {
      'import': '導入', 'search': '搜尋本地歌曲',
      'nav.all': '全部歌曲', 'nav.audio': '本地音樂', 'nav.video': '影片',
      'about': '檔案終端 · 本地播放',
      'title': '標題', 'duration': '時長',
      'empty.title': '暫無歌曲', 'empty.video': '暫無影片',
      'empty.sub': '點擊右上角「導入」，或直接把音訊/影片檔案拖進頁面',
      'count': '共 {n} 首',
      'pb.none': '未播放', 'pb.local': '本地',
      'mode.list': '順序', 'mode.loop': '循環', 'mode.one': '單曲', 'mode.shuffle': '隨機',
      'mode.title': '播放模式',
      'prev': '上一首', 'next': '下一首', 'playpause': '播放 / 暫停',
      'volume': '音量', 'seek': '進度', 'queue': '播放佇列', 'clear': '清空', 'close': '關閉',
      'lyrics.none': '暫無歌詞（本地檔案不包含歌詞）',
      'webFull': '網頁全屏', 'full': '全屏',
      'loader.sub': '正在初始化檔案',
    },
    'en': {
      'import': 'IMPORT', 'search': 'Search local tracks',
      'nav.all': 'All Tracks', 'nav.audio': 'Local Music', 'nav.video': 'Video',
      'about': 'Archive terminal · Local playback',
      'title': 'Title', 'duration': 'Duration',
      'empty.title': 'No tracks', 'empty.video': 'No videos',
      'empty.sub': 'Click IMPORT, or drop audio / video files here',
      'count': '{n} TRACKS',
      'pb.none': 'No track', 'pb.local': 'LOCAL',
      'mode.list': 'SEQ', 'mode.loop': 'LOOP', 'mode.one': 'ONE', 'mode.shuffle': 'SHUF',
      'mode.title': 'Playback mode',
      'prev': 'Previous', 'next': 'Next', 'playpause': 'Play / Pause',
      'volume': 'Volume', 'seek': 'Seek', 'queue': 'Play queue', 'clear': 'Clear', 'close': 'Close',
      'lyrics.none': 'No lyrics (local files carry none)',
      'webFull': 'Web fullscreen', 'full': 'Fullscreen',
      'loader.sub': 'INITIALIZING ARCHIVE',
    },
  };

  function detectLang() {
    const nav = (navigator.language || 'en').toLowerCase();
    if (nav.indexOf('zh') === 0) return /tw|hk|mo|hant/i.test(nav) ? 'zh-TW' : 'zh-CN';
    return 'en';
  }

  let lang = (function () {
    try { return localStorage.getItem('rhine-player:lang') || detectLang(); } catch (err) { return detectLang(); }
  })();

  function t(key) {
    return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  }

  /* ---------------- elements ---------------- */
  const el = {
    loader: $('#loader'),
    loaderSub: $('#loaderSub'),
    langSel: $('#langSel'),
    search: $('#search'),
    importBtn: $('#importBtn'),
    fileInput: $('#fileInput'),
    allCount: $('#allCount'),
    audioCount: $('#audioCount'),
    videoCount: $('#videoCount'),
    mainTitle: $('#mainTitle'),
    mainCount: $('#mainCount'),
    songList: $('#songList'),
    empty: $('#empty'),
    emptyTitle: $('#emptyTitle'),
    emptySub: $('#emptySub'),
    videoPanel: $('#videoPanel'),
    videoEl: $('#videoEl'),
    videoTitle: $('#videoTitle'),
    webFsBtn: $('#webFsBtn'),
    fullBtn: $('#fullBtn'),
    closeVideoBtn: $('#closeVideoBtn'),
    videoPlay: $('#videoPlay'),
    videoCur: $('#videoCur'),
    videoDur: $('#videoDur'),
    videoProgress: $('#videoProgress'),
    videoProgressFill: $('#videoProgressFill'),
    videoProgressThumb: $('#videoProgressThumb'),
    playbar: $('#playbar'),
    cover: $('#cover'),
    coverLetter: $('#coverLetter'),
    pbTitle: $('#pbTitle'),
    pbArtist: $('#pbArtist'),
    modeBtn: $('#modeBtn'),
    prev: $('#prev'),
    play: $('#play'),
    next: $('#next'),
    curTime: $('#curTime'),
    durTime: $('#durTime'),
    progress: $('#progress'),
    progressFill: $('#progressFill'),
    progressThumb: $('#progressThumb'),
    vol: $('#vol'),
    queueBtn: $('#queueBtn'),
    queueCount: $('#queueCount'),
    drawer: $('#drawer'),
    queueList: $('#queueList'),
    clearAll: $('#clearAll'),
    closeDrawer: $('#closeDrawer'),
    discBig: $('#discBig'),
    drawerTitle: $('#drawerTitle'),
    drawerArtist: $('#drawerArtist'),
    visualizer: $('#visualizer'),
    lyrics: $('#lyrics'),
  };

  /* ---------------- state ---------------- */
  const tracks = []; // { id, name, kind:'audio'|'video', format, size, duration, url }
  let current = -1;
  let playing = false;
  let mode = 'list'; // list | loop | one | shuffle
  let view = 'all';  // all | audio | video
  let localSeq = 0;

  /* ---------------- media graph ---------------- */
  const audio = new Audio();
  audio.preload = 'metadata';
  const video = el.videoEl;
  video.preload = 'metadata';

  let ctx = null;
  let gain = null;
  let analyser = null;

  function ensureAudio() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    ctx = new AC();
    gain = ctx.createGain();
    analyser = ctx.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.8;
    const srcA = ctx.createMediaElementSource(audio);
    const srcV = ctx.createMediaElementSource(video);
    srcA.connect(gain);
    srcV.connect(gain);
    gain.connect(analyser);
    analyser.connect(ctx.destination);
    gain.gain.value = Number(el.vol.value) || 0.7;
  }

  audio.addEventListener('ended', onEnded);
  video.addEventListener('ended', onEnded);

  /* ---------------- helpers ---------------- */
  function fmtTime(seconds) {
    const total = Math.max(0, Math.floor(seconds || 0));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
  }

  function fmtSize(bytes) {
    if (!bytes || bytes <= 0) return '';
    const units = ['B', 'KB', 'MB', 'GB'];
    let v = bytes;
    let i = 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i += 1; }
    return (v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)) + ' ' + units[i];
  }

  function currentTrack() {
    return current >= 0 && current < tracks.length ? tracks[current] : null;
  }

  function activeMedia() {
    const tr = currentTrack();
    return tr && tr.kind === 'video' ? video : audio;
  }

  function currentDuration() {
    const m = activeMedia();
    if (isFinite(m.duration) && m.duration > 0) return m.duration;
    const tr = currentTrack();
    return tr ? (tr.duration || 0) : 0;
  }

  function coverColor(name) {
    let hash = 0;
    for (let i = 0; i < name.length; i += 1) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
    return 'hsl(' + (hash % 360) + ', 62%, 52%)';
  }

  function visibleTracks() {
    const q = (el.search.value || '').trim().toLowerCase();
    return tracks.filter(function (tr) {
      if (view === 'audio' && tr.kind !== 'audio') return false;
      if (view === 'video' && tr.kind !== 'video') return false;
      return !q || tr.name.toLowerCase().indexOf(q) !== -1;
    });
  }

  /* ---------------- i18n apply ---------------- */
  function setModeLabel() {
    el.modeBtn.textContent = t('mode.' + mode);
    el.modeBtn.title = t('mode.title') + '：' + t('mode.' + mode);
  }

  function applyI18n() {
    document.documentElement.lang = lang;
    el.langSel.value = lang;
    document.querySelectorAll('[data-i18n]').forEach(function (node) {
      node.textContent = t(node.getAttribute('data-i18n'));
    });
    el.search.placeholder = t('search');
    el.importBtn.title = t('import');
    setModeLabel();
    el.prev.title = t('prev');
    el.next.title = t('next');
    el.play.title = t('playpause');
    el.videoPlay.title = t('playpause');
    el.queueBtn.title = t('queue');
    el.vol.title = t('volume');
    el.progress.setAttribute('aria-label', t('seek'));
    el.videoProgress.setAttribute('aria-label', t('seek'));
    el.loaderSub.textContent = t('loader.sub');
    render();
    renderNowPlaying();
    syncProgress();
  }

  /* ---------------- rendering ---------------- */
  function render() {
    const list = visibleTracks();
    el.allCount.textContent = String(tracks.length);
    el.audioCount.textContent = String(tracks.filter(function (x) { return x.kind === 'audio'; }).length);
    el.videoCount.textContent = String(tracks.filter(function (x) { return x.kind === 'video'; }).length);
    el.mainTitle.textContent = t('nav.' + view);
    el.mainCount.textContent = t('count').replace('{n}', String(tracks.length));
    el.queueCount.textContent = tracks.length ? String(tracks.length) : '';

    const isEmpty = list.length === 0;
    el.empty.style.display = isEmpty ? 'block' : 'none';
    if (isEmpty) {
      el.emptyTitle.textContent = tracks.length === 0 ? t('empty.title') : (view === 'video' ? t('empty.video') : t('empty.title'));
      el.emptySub.style.display = tracks.length === 0 ? 'block' : 'none';
    }

    el.songList.innerHTML = '';
    list.forEach(function (tr) {
      const idx = tracks.indexOf(tr);
      const row = document.createElement('div');
      row.className = 'song' + (idx === current ? ' current' : '');

      const num = document.createElement('span');
      num.className = 'song-num';
      if (idx === current && playing && tr.kind !== 'video') {
        num.innerHTML = '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>';
      } else if (idx === current) {
        num.innerHTML = '<span class="song-playing-ico">&#9835;</span>';
      } else {
        num.textContent = String(idx + 1);
      }

      const main = document.createElement('div');
      main.className = 'song-main';
      const title = document.createElement('div');
      title.className = 'song-title';
      title.textContent = tr.name;
      const meta = document.createElement('div');
      meta.className = 'song-meta';
      if (tr.kind === 'video') {
        const tag = document.createElement('span');
        tag.className = 'tag-video';
        tag.textContent = 'VIDEO';
        meta.appendChild(tag);
      }
      meta.appendChild(document.createTextNode((tr.format || 'AUDIO') + (tr.size ? ' · ' + tr.size : '')));
      main.appendChild(title);
      main.appendChild(meta);

      const dur = document.createElement('span');
      dur.className = 'song-dur';
      dur.textContent = tr.duration > 0 ? fmtTime(tr.duration) : '--:--';

      row.appendChild(num);
      row.appendChild(main);
      row.appendChild(dur);
      row.addEventListener('click', function () { select(idx, true); });
      el.songList.appendChild(row);
    });

    renderQueue();
  }

  function renderQueue() {
    el.queueList.innerHTML = '';
    tracks.forEach(function (tr, i) {
      const row = document.createElement('div');
      row.className = 'q-item' + (i === current ? ' current' : '');
      const name = document.createElement('span');
      name.className = 'q-name';
      name.textContent = tr.name;
      const dur = document.createElement('span');
      dur.className = 'q-dur';
      dur.textContent = tr.duration > 0 ? fmtTime(tr.duration) : '--:--';
      const del = document.createElement('button');
      del.className = 'q-del';
      del.textContent = '✕';
      del.title = t('clear');
      del.addEventListener('click', function (ev) { ev.stopPropagation(); removeTrack(i); });
      row.appendChild(name);
      row.appendChild(dur);
      row.appendChild(del);
      row.addEventListener('click', function () { select(i, true); });
      el.queueList.appendChild(row);
    });
  }

  function renderNowPlaying() {
    const tr = currentTrack();
    if (!tr) {
      el.pbTitle.textContent = t('pb.none');
      el.pbArtist.textContent = '—';
      el.coverLetter.textContent = '♪';
      el.cover.style.background = '#2a2c2e';
      el.discBig.textContent = '♪';
      el.discBig.classList.add('paused');
      el.drawerTitle.textContent = t('pb.none');
      el.drawerArtist.textContent = '—';
      return;
    }
    el.pbTitle.textContent = tr.name;
    el.pbArtist.textContent = (tr.format || 'AUDIO') + (tr.size ? ' · ' + tr.size : '') + ' · ' + t('pb.local') + (tr.kind === 'video' ? ' · VIDEO' : '');
    const letter = (tr.name || '?').charAt(0).toUpperCase();
    el.coverLetter.textContent = letter;
    el.cover.style.background = coverColor(tr.name);
    el.discBig.textContent = letter;
    el.drawerTitle.textContent = tr.name;
    el.drawerArtist.textContent = t('pb.local') + (tr.kind === 'video' ? ' · VIDEO' : '');
    el.discBig.classList.toggle('paused', !playing);
  }

  function setPlaying(on) {
    playing = on;
    const glyph = on ? '\u23F8' : '\u25B6';
    el.play.textContent = glyph;
    el.videoPlay.textContent = glyph;
    el.cover.classList.toggle('spinning', on);
    el.discBig.classList.toggle('paused', !on);
    el.playbar.classList.toggle('playing', on);
    render();
  }

  function syncProgress() {
    const m = activeMedia();
    const d = currentDuration();
    const cur = m.currentTime || 0;
    const pct = d > 0 ? Math.min(100, Math.max(0, (cur / d) * 100)) : 0;
    const timeStr = fmtTime(cur);
    const durStr = d > 0 ? fmtTime(d) : '--:--';
    el.curTime.textContent = timeStr;
    el.durTime.textContent = durStr;
    el.progressFill.style.width = pct + '%';
    el.progressThumb.style.left = pct + '%';
    el.videoCur.textContent = timeStr;
    el.videoDur.textContent = durStr;
    el.videoProgressFill.style.width = pct + '%';
    el.videoProgressThumb.style.left = pct + '%';
    const tr = currentTrack();
    if (tr && d > 0) tr.duration = d;
  }

  /* ---------------- video panel ---------------- */
  function updateVideoPanel(show) {
    const tr = currentTrack();
    const isV = !!(show && tr && tr.kind === 'video');
    el.videoPanel.classList.toggle('visible', isV);
    if (!isV) el.videoPanel.classList.remove('web-full');
    el.videoTitle.textContent = tr ? tr.name : '';
  }

  /* ---------------- playback ---------------- */
  function select(index, autoplay) {
    if (index < 0 || index >= tracks.length) return;
    current = index;
    const tr = tracks[index];
    if (tr.kind === 'video') {
      video.src = tr.url;
      try { video.currentTime = 0; } catch (err) {}
      audio.src = '';
      updateVideoPanel(true);
    } else {
      audio.src = tr.url;
      try { audio.currentTime = 0; } catch (err) {}
      video.src = '';
      updateVideoPanel(false);
    }
    render();
    renderNowPlaying();
    syncProgress();
    if (autoplay) {
      ensureAudio();
      activeMedia().play().then(function () { setPlaying(true); }).catch(function () { setPlaying(false); });
    } else {
      setPlaying(false);
    }
  }

  function toggle() {
    if (current < 0) {
      if (tracks.length) select(0, true);
      return;
    }
    ensureAudio();
    const tr = currentTrack();
    if (playing) {
      activeMedia().pause();
      setPlaying(false);
    } else {
      if (tr.kind === 'video') updateVideoPanel(true);
      activeMedia().play().then(function () { setPlaying(true); }).catch(function () { setPlaying(false); });
    }
  }

  function nextIndex() {
    const n = tracks.length;
    if (!n) return -1;
    if (mode === 'one') return current;
    if (mode === 'shuffle') {
      if (n === 1) return current;
      let r = current;
      while (r === current) r = Math.floor(Math.random() * n);
      return r;
    }
    if (current + 1 < n) return current + 1;
    return mode === 'loop' ? 0 : -1;
  }

  function prevIndex() {
    const n = tracks.length;
    if (!n) return -1;
    if (mode === 'one') return current;
    if (mode === 'shuffle') {
      if (n === 1) return current;
      let r = current;
      while (r === current) r = Math.floor(Math.random() * n);
      return r;
    }
    return (current - 1 + n) % n;
  }

  function step(dir) {
    if (!tracks.length) return;
    const idx = dir > 0 ? nextIndex() : prevIndex();
    if (idx < 0) {
      activeMedia().pause();
      setPlaying(false);
      return;
    }
    select(idx, playing);
  }

  function onEnded() {
    if (mode === 'one') {
      activeMedia().currentTime = 0;
      activeMedia().play().catch(function () {});
      return;
    }
    const idx = nextIndex();
    if (idx < 0) {
      setPlaying(false);
      return;
    }
    select(idx, true);
  }

  function cycleMode() {
    const order = ['list', 'loop', 'one', 'shuffle'];
    mode = order[(order.indexOf(mode) + 1) % order.length];
    setModeLabel();
  }

  /* ---------------- import / remove ---------------- */
  const AUDIO_EXT = /\.(mp3|flac|wav|ogg|oga|opus|m4a|aac|aif|aiff|webm)$/i;
  const VIDEO_EXT = /\.(mp4|ogv|mov|m4v)$/i;

  function classify(file) {
    const type = (file.type || '').toLowerCase();
    if (type.indexOf('video/') === 0) return 'video';
    if (type.indexOf('audio/') === 0) return 'audio';
    const name = (file.name || '').toLowerCase();
    if (AUDIO_EXT.test(name)) return 'audio';
    if (VIDEO_EXT.test(name)) return 'video';
    return null;
  }

  function addFiles(fileList) {
    if (!fileList || !fileList.length) return;
    let first = -1;
    Array.prototype.forEach.call(fileList, function (file) {
      const kind = classify(file);
      if (!kind) return;
      let url;
      try { url = URL.createObjectURL(file); } catch (err) { return; }
      localSeq += 1;
      const entry = {
        id: 'RL-' + String(localSeq).padStart(3, '0'),
        name: (file.name || '').replace(/\.[^.]+$/, '') || file.name,
        kind: kind,
        format: ((file.name || '').split('.').pop() || 'FILE').toUpperCase(),
        size: fmtSize(file.size),
        duration: 0,
        url: url,
      };
      tracks.push(entry);
      if (first < 0) first = tracks.length - 1;
      try {
        const probe = new Audio();
        probe.preload = 'metadata';
        probe.src = url;
        probe.addEventListener('loadedmetadata', function onMeta() {
          if (isFinite(probe.duration) && probe.duration > 0) entry.duration = probe.duration;
          render();
          probe.removeEventListener('loadedmetadata', onMeta);
          probe.src = '';
        });
      } catch (err) { /* duration fills in on load */ }
    });

    if (first < 0) return;
    render();
    if (current < 0 || !playing) select(first, true);
  }

  function removeTrack(index) {
    if (index < 0 || index >= tracks.length) return;
    const removed = tracks.splice(index, 1)[0];
    if (removed.url) { try { URL.revokeObjectURL(removed.url); } catch (err) {} }
    if (index === current) {
      audio.pause();
      video.pause();
      audio.src = '';
      video.src = '';
      setPlaying(false);
      updateVideoPanel(false);
      current = tracks.length ? Math.min(index, tracks.length - 1) : -1;
      if (current >= 0) select(current, false);
      else renderNowPlaying();
    } else if (index < current) {
      current -= 1;
    }
    render();
    syncProgress();
  }

  function clearAll() {
    tracks.forEach(function (tr) { if (tr.url) { try { URL.revokeObjectURL(tr.url); } catch (err) {} } });
    tracks.length = 0;
    current = -1;
    audio.pause();
    video.pause();
    audio.src = '';
    video.src = '';
    setPlaying(false);
    updateVideoPanel(false);
    render();
    renderNowPlaying();
    syncProgress();
  }

  /* ---------------- progress seek ---------------- */
  function bindSeek(bar, getMedia) {
    let scrubbing = false;
    function apply(ev) {
      const rect = bar.getBoundingClientRect();
      if (!rect.width) return;
      const ratio = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
      const m = getMedia();
      if (isFinite(m.duration) && m.duration > 0) m.currentTime = ratio * m.duration;
      syncProgress();
    }
    bar.addEventListener('pointerdown', function (ev) {
      ev.preventDefault();
      scrubbing = true;
      try { bar.setPointerCapture(ev.pointerId); } catch (e) {}
      apply(ev);
    });
    bar.addEventListener('pointermove', function (ev) { if (scrubbing) apply(ev); });
    bar.addEventListener('pointerup', function () { scrubbing = false; });
    bar.addEventListener('pointercancel', function () { scrubbing = false; });
  }

  bindSeek(el.progress, activeMedia);
  bindSeek(el.videoProgress, function () { return video; });

  /* ---------------- visualizer ---------------- */
  const VIS_BARS = 44;
  const visBuf = new Uint8Array(512);

  function prepCanvas(canvas) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = Math.max(60, canvas.clientWidth || 280);
    const h = Math.max(20, canvas.clientHeight || 80);
    if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
    }
    const g = canvas.getContext('2d');
    if (!g) return null;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    return { g: g, w: w, h: h };
  }

  function drawVisualizer() {
    const c = prepCanvas(el.visualizer);
    if (!c) return;
    const g = c.g;
    const w = c.w;
    const h = c.h;

    g.strokeStyle = 'rgba(231, 229, 225, 0.06)';
    g.lineWidth = 1;
    for (let i = 0; i <= 8; i += 1) {
      const x = (w / 8) * i + 0.5;
      g.beginPath();
      g.moveTo(x, 0);
      g.lineTo(x, h);
      g.stroke();
    }

    let data = null;
    if (analyser && playing) {
      analyser.getByteFrequencyData(visBuf);
      data = visBuf;
    }

    const mid = h - 3;
    const total = VIS_BARS * 2;
    const bw = w / total;
    g.shadowColor = 'rgba(255, 123, 0, 0.55)';
    g.shadowBlur = 6;

    for (let i = 0; i < VIS_BARS; i += 1) {
      let v;
      if (data) {
        const bin = Math.floor(Math.pow(i / VIS_BARS, 1.6) * (data.length * 0.6));
        v = data[bin] / 255;
      } else {
        const tt = Date.now() / 260;
        v = 0.04 + 0.03 * (Math.sin(i * 0.5 + tt) * 0.5 + 0.5);
      }
      const bh = Math.max(1.5, v * (h - 12));
      const xL = w / 2 - (i + 1) * bw;
      const xR = w / 2 + i * bw;
      const barW = Math.max(1, bw * 0.62);
      g.fillStyle = 'rgba(255, 123, 0, 0.9)';
      g.fillRect(xL, mid - bh, barW, bh);
      g.fillRect(xR, mid - bh, barW, bh);
      if (v > 0.58) {
        g.fillStyle = 'rgba(185, 228, 50, 0.95)';
        g.fillRect(xL, mid - bh, barW, 1.6);
        g.fillRect(xR, mid - bh, barW, 1.6);
      }
    }
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(231, 229, 225, 0.28)';
    g.fillRect(0, mid, w, 1);
  }

  let lastVis = 0;
  function visLoop(now) {
    window.requestAnimationFrame(visLoop);
    if (now - lastVis < 33) return;
    lastVis = now;
    drawVisualizer();
  }

  /* ---------------- events ---------------- */
  el.play.addEventListener('click', toggle);
  el.prev.addEventListener('click', function () { step(-1); });
  el.next.addEventListener('click', function () { step(1); });
  el.modeBtn.addEventListener('click', cycleMode);
  el.vol.addEventListener('input', function () { if (gain) gain.gain.value = Number(el.vol.value); });
  el.importBtn.addEventListener('click', function () { el.fileInput.click(); });
  el.fileInput.addEventListener('change', function () { addFiles(el.fileInput.files); el.fileInput.value = ''; });
  el.search.addEventListener('input', render);
  el.queueBtn.addEventListener('click', function () { el.drawer.classList.toggle('open'); });
  el.closeDrawer.addEventListener('click', function () { el.drawer.classList.remove('open'); });
  el.clearAll.addEventListener('click', clearAll);

  el.videoPlay.addEventListener('click', toggle);
  el.closeVideoBtn.addEventListener('click', function () {
    video.pause();
    setPlaying(false);
    updateVideoPanel(false);
  });
  el.webFsBtn.addEventListener('click', function () {
    el.videoPanel.classList.toggle('web-full');
  });
  el.fullBtn.addEventListener('click', function () {
    if (document.fullscreenElement) {
      try { document.exitFullscreen(); } catch (err) {}
    } else if (el.videoPanel.classList.contains('visible')) {
      try { el.videoPanel.requestFullscreen(); } catch (err) {}
    }
  });
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement) el.videoPanel.classList.remove('web-full');
  });

  el.langSel.addEventListener('change', function () {
    lang = el.langSel.value;
    try { localStorage.setItem('rhine-player:lang', lang); } catch (err) {}
    applyI18n();
  });

  document.querySelectorAll('.side-item').forEach(function (btn) {
    btn.addEventListener('click', function () {
      view = btn.getAttribute('data-view');
      document.querySelectorAll('.side-item').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      render();
    });
  });

  window.addEventListener('dragover', function (ev) { ev.preventDefault(); });
  window.addEventListener('drop', function (ev) { ev.preventDefault(); addFiles(ev.dataTransfer && ev.dataTransfer.files); });

  document.addEventListener('keydown', function (ev) {
    if (ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'BUTTON' || ev.target.tagName === 'SELECT')) return;
    if (ev.key === 'Escape') {
      if (el.videoPanel.classList.contains('web-full')) el.videoPanel.classList.remove('web-full');
      else el.drawer.classList.remove('open');
      return;
    }
    if (ev.key === ' ' || ev.code === 'Space') { ev.preventDefault(); toggle(); }
    else if (ev.key === 'ArrowRight') { const m = activeMedia(); if (currentTrack()) m.currentTime = Math.min(currentDuration(), (m.currentTime || 0) + 5); }
    else if (ev.key === 'ArrowLeft') { const m = activeMedia(); if (currentTrack()) m.currentTime = Math.max(0, (m.currentTime || 0) - 5); }
  });

  window.setInterval(function () { if (playing) syncProgress(); }, 250);

  /* ---------------- loader ---------------- */
  window.setTimeout(function () {
    el.loader.classList.add('done');
    window.setTimeout(function () {
      if (el.loader.parentNode) el.loader.parentNode.removeChild(el.loader);
    }, 620);
  }, 1400);

  /* ---------------- boot ---------------- */
  setModeLabel();
  applyI18n();
  renderNowPlaying();
  syncProgress();
  window.requestAnimationFrame(visLoop);
})();
  </script>
</body>
</html>
