<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RHINE LAB · AUDIO ARCHIVE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 载入动画 -->
  <div id="loader" aria-hidden="true">
    <div class="loader-ring">
      <svg viewBox="0 0 64 64">
        <circle cx="32" cy="32" r="26" fill="none" stroke="rgba(255,123,0,0.18)" stroke-width="1"></circle>
        <circle class="lr-arc" cx="32" cy="32" r="26" fill="none" stroke="#ff7b00" stroke-width="1.6" stroke-dasharray="163" stroke-dashoffset="163"></circle>
        <circle cx="32" cy="32" r="3.5" fill="#ff7b00"></circle>
      </svg>
    </div>
    <div class="loader-brand">RHINE LAB</div>
    <div class="loader-line"><i id="loaderFill"></i></div>
    <div class="loader-sub" id="loaderSub">INITIALIZING ARCHIVE…</div>
  </div>

  <div class="scan" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><i></i></span>
      <span class="brand-name">RHINE LAB · AUDIO ARCHIVE</span>
    </div>
    <div class="topbar-actions">
      <input id="search" class="search" type="search" placeholder="搜索本地歌曲" aria-label="搜索">
      <select id="langSel" class="lang-sel" title="Language">
        <option value="zh-CN">简体中文</option>
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
      </select>
      <button id="importBtn" class="btn-primary" title="导入本地音乐">&#65291; IMPORT</button>
    </div>
  </header>

  <div class="layout">
    <aside class="side">
      <div class="side-title">AUDIO ARCHIVE</div>
      <button class="side-item active" data-view="all"><span data-i18n="nav.all">全部歌曲</span> <span class="cnt" id="allCount">0</span></button>
      <button class="side-item" data-view="audio"><span data-i18n="nav.audio">本地音乐</span> <span class="cnt" id="audioCount">0</span></button>
      <button class="side-item" data-view="video"><span data-i18n="nav.video">视频</span> <span class="cnt" id="videoCount">0</span></button>
      <div class="side-title second">ABOUT</div>
      <p class="side-note" data-i18n="about">档案终端 · 本地播放</p>
    </aside>

    <main class="main">
      <!-- 视频播放模块 -->
      <section id="videoPanel" class="video-panel">
        <video id="videoEl" playsinline></video>
        <div class="video-top">
          <span id="videoTitle" class="video-title"></span>
          <div class="video-actions">
            <button id="webFsBtn" class="vbtn" title="网页全屏">&#9636; <span data-i18n="webFull">网页全屏</span></button>
            <button id="fullBtn" class="vbtn" title="全屏">&#9974; <span data-i18n="full">全屏</span></button>
            <button id="closeVideoBtn" class="vbtn" title="关闭">&#10005;</button>
          </div>
        </div>
        <div class="video-controls">
          <button id="videoPlay" class="vbtn big" title="播放/暂停">&#9654;</button>
          <span id="videoCur" class="time">00:00</span>
          <div id="videoProgress" class="progress" role="slider" aria-label="进度" tabindex="0">
            <div id="videoProgressFill" class="fill"></div>
            <div id="videoProgressThumb" class="thumb"></div>
          </div>
          <span id="videoDur" class="time">--:--</span>
        </div>
      </section>

      <div class="main-head">
        <h1 id="mainTitle">全部歌曲</h1>
        <span id="mainCount" class="sub"></span>
      </div>
      <div class="list-head">
        <span class="col-op"></span>
        <span class="col-title" data-i18n="title">标题</span>
        <span class="col-dur" data-i18n="duration">时长</span>
      </div>
      <div id="songList" class="song-list"></div>
      <div id="empty" class="empty">
        <div class="empty-ico" aria-hidden="true">&#9835;</div>
        <div id="emptyTitle" data-i18n="empty.title">暂无歌曲</div>
        <div class="empty-sub" id="emptySub" data-i18n="empty.sub">点击右上角「导入」，或直接把音频/视频文件拖进页面</div>
      </div>
    </main>
  </div>

  <!-- 音乐动态条（科技感镜像频谱） -->
  <div class="viz-strip" aria-hidden="true">
    <canvas id="visualizer" class="visualizer"></canvas>
  </div>

  <footer class="playbar" id="playbar">
    <i class="corner tl" aria-hidden="true"></i><i class="corner tr" aria-hidden="true"></i><i class="corner bl" aria-hidden="true"></i><i class="corner br" aria-hidden="true"></i>
    <div class="pb-left">
      <div class="cover" id="cover"><span class="cover-letter" id="coverLetter">&#9835;</span><span class="disc" aria-hidden="true"></span></div>
      <div class="pb-info">
        <div class="pb-title" id="pbTitle">未播放</div>
        <div class="pb-artist" id="pbArtist">—</div>
      </div>
    </div>

    <div class="pb-center">
      <div class="pb-controls">
        <button id="modeBtn" class="ctrl mode" title="播放模式">顺序</button>
        <button id="prev" class="ctrl" title="上一首" aria-label="上一首">&#9198;</button>
        <button id="play" class="ctrl big" title="播放/暂停" aria-label="播放/暂停">&#9654;</button>
        <button id="next" class="ctrl" title="下一首" aria-label="下一首">&#9197;</button>
      </div>
      <div class="pb-progress">
        <span id="curTime" class="time">00:00</span>
        <div id="progress" class="progress" role="slider" aria-label="进度" tabindex="0">
          <div id="progressFill" class="fill"></div>
          <div id="progressThumb" class="thumb"></div>
        </div>
        <span id="durTime" class="time">--:--</span>
      </div>
    </div>

    <div class="pb-right">
      <button id="queueBtn" class="ctrl" title="播放队列">&#8801; <span class="queue-badge" id="queueCount"></span></button>
      <div class="vol">
        <span class="vol-ico" aria-hidden="true">&#128266;</span>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="0.7" aria-label="音量">
      </div>
    </div>
  </footer>

  <div id="drawer" class="drawer">
    <i class="corner tl" aria-hidden="true"></i><i class="corner tr" aria-hidden="true"></i><i class="corner bl" aria-hidden="true"></i><i class="corner br" aria-hidden="true"></i>
    <div class="drawer-head">
      <span data-i18n="queue">播放队列</span>
      <span class="drawer-actions">
        <button id="clearAll" class="link-btn" data-i18n="clear">清空</button>
        <button id="closeDrawer" class="link-btn" aria-label="关闭">&#10005;</button>
      </span>
    </div>
    <div id="queueList" class="queue-list"></div>
    <div class="drawer-now">
      <div class="disc-big" id="discBig">&#9835;</div>
      <div class="drawer-title" id="drawerTitle">未播放</div>
      <div class="drawer-artist" id="drawerArtist">—</div>
      <div class="drawer-lyrics" id="lyrics" data-i18n="lyrics.none">暂无歌词（本地文件不包含歌词）</div>
    </div>
  </div>

  <input id="fileInput" type="file" multiple accept="audio/*,video/*,.mp3,.flac,.wav,.ogg,.oga,.opus,.m4a,.aac,.aif,.aiff,.webm,.mp4,.ogv,.mov,.m4v" style="display:none">
  <script src="renderer.js"></script>
</body>
</html>
